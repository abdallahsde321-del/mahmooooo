name: Run Restreamer

on:
  workflow_dispatch: # تشغيل البث يدوياً بضغطة زر

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and mbuffer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mbuffer

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Restream Script
        run: python main.py
